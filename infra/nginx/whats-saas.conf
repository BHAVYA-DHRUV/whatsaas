# NGINX reverse proxy — replace YOUR_DOMAIN and SSL cert paths
# Install: sudo ln -s $(pwd)/infra/nginx/whats-saas.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/s;

upstream whats_saas_app {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location /api/webhook/ {
        limit_req zone=webhook_limit burst=100 nodelay;
        proxy_pass http://whats_saas_app;
        include /etc/nginx/snippets/whats-saas-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://whats_saas_app;
        include /etc/nginx/snippets/whats-saas-proxy.conf;
    }

    location / {
        proxy_pass http://whats_saas_app;
        include /etc/nginx/snippets/whats-saas-proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://whats_saas_app;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/snippets/whats-saas-proxy.conf;
    }
}
