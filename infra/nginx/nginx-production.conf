# WhatSaaS — multi-domain production NGINX
# app.domain.com → Next.js :3000
# api.domain.com → Next.js :3000 (API only)
# evolution.domain.com → Evolution :8080

limit_req_zone $binary_remote_addr zone=app_limit:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
limit_req_zone $binary_remote_addr zone=evo_limit:20m rate=100r/s;

upstream nextjs_upstream {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream evolution_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- APP ---
server {
    listen 80;
    server_name app.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/app.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /uploads/ {
        alias /var/www/whats-saas/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        limit_req zone=app_limit burst=80 nodelay;
        proxy_pass http://nextjs_upstream;
        include /etc/nginx/snippets/whats-saas-proxy.conf;
    }
}

# --- API (same app, stricter limits) ---
server {
    listen 443 ssl http2;
    server_name api.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;

    location / {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://nextjs_upstream;
        include /etc/nginx/snippets/whats-saas-proxy.conf;
    }
}

# --- Evolution API ---
server {
    listen 443 ssl http2;
    server_name evolution.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/evolution.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolution.YOUR_DOMAIN/privkey.pem;

    location / {
        limit_req zone=evo_limit burst=200 nodelay;
        proxy_pass http://evolution_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
